aid: likewise
name: LikeWise
description: 'Likewise Software was a Bellevue, Washington enterprise software company building storage,
  identity and security products that bridged Linux, Unix and Mac systems into Microsoft Active Directory
  environments. Its OEM line, Likewise Storage Services, supplied SMB/CIFS multi-protocol file access to
  network storage vendors including HP StorageWorks, Riverbed, EMC Data Domain and NetApp, while Likewise
  Data Analytics and Governance covered auditing, reporting and compliance (HIPAA, PCI DSS, SOX, FISMA)
  over unstructured data. Its Likewise Enterprise and Likewise Open Active Directory integration products
  moved to BeyondTrust. Backed by Trinity Ventures, the company was acquired and no longer operates: there
  is no live website, developer portal, documentation or public API, and the likewise.com domain now
  redirects to an unrelated owner.'
